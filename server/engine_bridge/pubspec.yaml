name: dhamet_engine_bridge
description: >-
  Exposes the Dhamet rules engine to Node.js: compiled to JavaScript with
  dart2js and loaded by the NestJS server.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.2

dependencies:
  dhamet_engine:
    path: ../../packages/dhamet_engine

dev_dependencies:
  lints: ^6.0.0
  node_preamble: ^2.0.2
  test: ^1.25.6
