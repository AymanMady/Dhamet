name: dhamet
description: "Dhamet (ظامت) — the traditional Mauritanian board game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  dhamet_engine:
    path: packages/dhamet_engine
  dhamet_ai:
    path: packages/dhamet_ai
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  intl: ^0.20.3
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  async: ^2.13.1
  stream_channel: ^2.1.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL-ReemKufi.txt
  fonts:
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
