name: dhamet_ai
description: >-
  Computer opponent for Dhamet (ظامت), the traditional Mauritanian draughts
  game: negamax search with alpha-beta pruning on top of dhamet_engine.
  Independent of Flutter.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.2

dependencies:
  dhamet_engine:
    path: ../dhamet_engine

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
